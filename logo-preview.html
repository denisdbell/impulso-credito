<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Logo — Impulso Crédito</title>
<style>body{font-family:Arial,Helvetica,sans-serif;background:#f4f6fa;padding:40px}
.box{max-width:640px;margin:0 auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h4{color:#666;margin:28px 0 8px}</style></head><body>
<div class="box">
<h4>Cabecera centrada (PDF / páginas web)</h4>
<div style="text-align:center;margin-bottom:12px">
  <span style="display:inline-block;width:59px;height:59px;line-height:59px;text-align:center;background:#1c4587;color:#fff;border-radius:13px;font-size:27px;font-weight:bold">IC</span>
  <div style="margin-top:6px"><span style="font-size:24px;font-weight:bold;color:#1c4587">Impulso</span><span style="font-size:24px;font-weight:bold;color:#e8a33d"> Crédito</span></div>
  <div style="font-size:12px;color:#888">Préstamos rápidos y confiables</div>
</div>

<h4>Cabecera de correo (fila)</h4>
<table style="border-collapse:collapse;width:100%;border-bottom:3px solid #1c4587;margin-bottom:14px"><tr>
  <td style="width:62px;padding:0 10px 8px 0;vertical-align:middle">
    <span style="display:inline-block;width:46px;height:46px;line-height:46px;text-align:center;background:#1c4587;color:#fff;border-radius:10px;font-size:21px;font-weight:bold">IC</span>
  </td>
  <td style="padding-bottom:8px;vertical-align:middle">
    <span style="font-size:21px;font-weight:bold;color:#1c4587">Impulso</span><span style="font-size:21px;font-weight:bold;color:#e8a33d"> Crédito</span>
    <div style="font-size:11px;color:#888">Préstamos rápidos y confiables</div>
  </td>
</tr></table>
</div></body></html>
